[build-system]
requires = [
    # PEP 639 license expressions (license = "GPL-3.0-or-later") need 77+;
    # older setuptools fails to build this project rather than warning
    "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project]
name = "extremal-rays"
version = "0.4.0"
description = "Fast extremal rays of pointed polyhedral cones via Clarkson's output-sensitive algorithm"
authors = [{ name = "Nate MacFadden for the Liam McAllister Group" }]
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["polyhedral cone", "extremal rays", "redundancy removal", "Clarkson", "linear programming", "Mori cone"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Floors are the oldest versions the suite is tested against (see the
# dependency-floors CI job); the highspy ceiling is deliberate -- ~94% of this
# package's runtime and all of its numerical verdicts come from HiGHS, so a
# major bump gets tested before it is trusted.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "highspy>=1.7,<2",
]
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest",
]
# python-flint accelerates the exact rational fallback in the cleanup pass
# (pure-Python Bareiss elimination is used when it is absent)
exact = [
    "python-flint",
]

[project.urls]
Repository = "https://github.com/LiamMcAllisterGroup/extremalrays"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
extremal_rays = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
# ruff's default rule set, pinned so a ruff upgrade can't silently change what
# CI enforces: pyflakes (F) plus pycodestyle import/statement/runtime errors.
select = ["E4", "E7", "E9", "F"]
