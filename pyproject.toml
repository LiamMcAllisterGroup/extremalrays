[build-system]
requires = [
    "setuptools>=64",
]
build-backend = "setuptools.build_meta"

[project]
name = "extremal-rays"
version = "0.3.0"
description = "Fast extremal rays of pointed polyhedral cones via Clarkson's output-sensitive algorithm"
authors = [{ name = "Nate MacFadden for the Liam McAllister Group" }]
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["polyhedral cone", "extremal rays", "redundancy removal", "Clarkson", "linear programming", "Mori cone"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy",
    "scipy",
    "highspy",
]
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest",
]
# python-flint accelerates the exact rational fallback in the cleanup pass
# (pure-Python Bareiss elimination is used when it is absent)
exact = [
    "python-flint",
]

[project.urls]
Repository = "https://github.com/LiamMcAllisterGroup/extremal_rays"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
# ruff's default rule set, pinned so a ruff upgrade can't silently change what
# CI enforces: pyflakes (F) plus pycodestyle import/statement/runtime errors.
select = ["E4", "E7", "E9", "F"]
