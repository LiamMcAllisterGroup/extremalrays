name: Deploy

# publishes to PyPI when a GitHub release is published. Trusted publishing
# (OIDC), so there is no token in the repository secrets; the trust is
# configured on the PyPI project instead
on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test,exact]"
      - name: Test
        run: pytest tests/

  make-dist:
    # pure Python, so one sdist and one py3-none-any wheel cover every
    # platform; no cibuildwheel matrix is needed
    name: Make SDist and Wheel
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: pipx run build
      - name: Check metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ci-dist
          path: dist/*

  deploy-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [make-dist]
    environment:
      name: pypi
      url: https://pypi.org/p/extremalrays
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ci-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
